# Naver users have no Supabase JWT before login; the handler verifies signed state.
[functions.naver-auth]
verify_jwt = false

# Existing dashboard deployment retains its original slug after display-name changes.
[functions.smart-service]
verify_jwt = false
entrypoint = "./functions/naver-auth/index.ts"

# Handler validates the user with Auth before calling the paid image API.
[functions.outfit-image]
verify_jwt = false

# The handler validates the user with Supabase Auth.
[functions.codini-chat]
verify_jwt = false
